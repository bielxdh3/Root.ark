name: Issue 66 picker / pinned MOVE candidate validation

on:
  push:
    branches:
      - agent/pr286-picker-integration-w181-20261122
      - agent/pr292-move-picker-w181-20261122
      - agent/mission-20261122-pr292-ci-prime-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  picker-and-pin:
    name: Pinned picker and FOD security (${{ matrix.os }}, Node 22)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The real FOD and signed MOVE cases import HPKE and native dependencies.
      # A clean hosted checkout never includes node_modules. Install exactly
      # the lockfile graph before running the same complete test selection.
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify all issue 66 picker, signed pin, MOVE and hydration contracts
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test test/issue-66-*.test.js
