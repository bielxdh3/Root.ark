name: CodeQL

on:
  push:
    branches:
      - Root/main
  pull_request:
    branches:
      - Root/main
      - 'cdx/zk65-split-pr*'
      - 'cdx/issue66-picker-pin-integration-prime-20261107'
      - 'cdx/issue63-text-batch-prime-20261106'
      - 'cdx/rootark-roadmap-operational-20261105'
  schedule:
    - cron: "37 11 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript / TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
