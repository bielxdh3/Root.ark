name: Security Regression

on:
  push:
    branches:
      - Root/main
  pull_request:
    branches:
      - Root/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.event.pull_request.number || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu-validation:
    name: Ubuntu Node 22 - full validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic locale and timezone
        run: echo "TZ=UTC" >> $GITHUB_ENV && echo "LC_ALL=C" >> $GITHUB_ENV

      - name: Run syntax validation
        run: npm run validate:syntax

      - name: Run automated tests
        run: npm test

      - name: Guard runtime artifacts
        run: npm run validate:artifacts

      - name: Audit locked dependencies
        run: npm run validate:dependencies

      - name: Confirm clean checkout
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  windows-release-gate:
    name: Windows Node 22 - mandatory release gates
    runs-on: windows-2022
    # Keep isolated mandatory gates separate from the full suite's time budget.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic locale and timezone
        shell: pwsh
        run: "'TZ=UTC' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append; 'LC_ALL=C' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Run repository release gate
        env:
          ROOTARK_CANONICAL_TEST_SEPARATE_JOB: 'true'
        run: npm run validate:release-gate

      - name: Confirm clean checkout
        shell: pwsh
        run: if (git status --porcelain) { throw 'checkout contains generated artifacts' }

  windows-canonical-suite:
    name: Windows Node 22 - complete canonical tests
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic locale and timezone
        shell: pwsh
        run: "'TZ=UTC' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append; 'LC_ALL=C' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Run complete canonical test suite
        # Calls the unchanged canonical npm test with bounded concurrency.
        # Only safe TAP counters/hashes and timeout heartbeats reach the CI log.
        run: node scripts/run-windows-canonical-tests.js

      - name: Confirm clean checkout
        shell: pwsh
        run: if (git status --porcelain) { throw 'checkout contains generated artifacts' }

  windows-validation:
    name: Windows Node 22 - syntax and tests
    runs-on: ubuntu-latest
    needs: [windows-release-gate, windows-canonical-suite]
    if: ${{ always() }}
    steps:
      - name: Require both Windows jobs to pass
        env:
          RELEASE_RESULT: ${{ needs.windows-release-gate.result }}
          SUITE_RESULT: ${{ needs.windows-canonical-suite.result }}
        run: |
          test "$RELEASE_RESULT" = success
          test "$SUITE_RESULT" = success
