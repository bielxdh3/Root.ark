name: Security Regression

on:
  push:
    branches:
      - Root/main
      - 'cdx/issue68-owner-recipient-use-w60-20261106'
  pull_request:
    branches:
      - Root/main
      - 'cdx/zk65-split-pr*'
      - 'cdx/issue68-*'
      - 'cdx/issue242-p2p-grant-w47-20261106'
      - 'cdx/issue63-auth-browser-select-w21-20261106'
      - 'cdx/issue63-local-encrypted-index-w21-20261106'
      - 'cdx/issue63-local-preview-w48-20261106'
      - 'cdx/issue63-protected-search-bounded-20261106'
      - 'cdx/issue63-protected-selected-get-w21-20261106'
      - 'cdx/issue63-text-batch-prime-20261106'
      - 'cdx/issue64-offline-w50-20261106'
      - 'cdx/issue66-picker-pin-integration-prime-20261107'
      - 'cdx/issue66-pinned-move-preobserve-w68-20261106'
      - 'cdx/issue66-pinned-w20-20261106'
      - 'cdx/issue67-multi-recovery-w45-v2-20261106'
      - 'cdx/issue68-owner-recipient-use-w60-20261106'
      - 'cdx/issue68-portable-cli-w60-20261106'
      - 'cdx/issue68-recipient-enrollment-worker43-20261106'
      - 'cdx/issue68-scoped-capabilities-worker22-20261106'
      - 'cdx/issue68-zk-recipient-w32-20261106'
      - 'cdx/issue68-zk-share-w32-20261106'
      - 'cdx/rootark-android-paged-protected-w16-20261106'
      - 'cdx/rootark-android-strict-json-prime-20261106'
      - 'cdx/rootark-issue242-app-session-worker33-20261106'
      - 'cdx/rootark-issue242-large-file-worker33-20261106'
      - 'cdx/rootark-issue242-poc-20261106'
      - 'cdx/rootark-issue242-research-20261106'
      - 'cdx/rootark-issue242-session-w13-20261106'
      - 'cdx/rootark-issue64-filelist-20261106'
      - 'cdx/rootark-issue64-protected-fetch-worker28-20261106'
      - 'cdx/rootark-issue66-ondemand-worker20-20261106'
      - 'cdx/rootark-issue67-restore-20261106'
      - 'cdx/rootark-issue67-resume-cli-20261106'
      - 'cdx/rootark-roadmap-operational-20261105'
      - 'feature/issue66-inventory-20261106'
      - 'issue67-restore-preview-w25-20261106'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.event.pull_request.number || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  p2p-lifecycle-and-stall:
    name: P2P Node 22 - room lifecycle and 1:N stall
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'cdx/issue242-p2p-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install disposable WebRTC dependencies
        run: npm ci --ignore-scripts
        working-directory: experiments/issue242-webrtc
      - name: Require valid broker, client and transfer syntax
        run: |
          node --check experiments/issue242-webrtc/client.js
          node --check experiments/issue242-webrtc/server.cjs
          node --check experiments/issue242-webrtc/transfer-protocol.js
      - name: Require full 1:N transport, security and lifecycle suite
        run: npm test
        working-directory: experiments/issue242-webrtc

  p2p-edge-lifecycle:
    name: P2P Windows Edge - 1:N and lifecycle
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'cdx/issue242-p2p-') }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require Microsoft Edge
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe')) {
            throw 'Microsoft Edge required for P2P browser lifecycle checks'
          }
      - name: Install Root.ark dependencies
        run: npm ci --ignore-scripts
      - name: Install disposable WebRTC dependencies
        run: npm ci --ignore-scripts
        working-directory: experiments/issue242-webrtc
      - name: Require real standalone Edge DataChannel scenarios
        run: npm run test:browser
        working-directory: experiments/issue242-webrtc
      - name: Require real Root.ark signed-session Edge lifecycle
        run: node experiments/issue242-webrtc/tests/app-browser.cjs

  ubuntu-validation:
    name: Ubuntu Node 22 - full validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic locale and timezone
        run: echo "TZ=UTC" >> $GITHUB_ENV && echo "LC_ALL=C" >> $GITHUB_ENV

      - name: Run syntax validation
        run: npm run validate:syntax

      - name: Run automated tests
        run: npm test

      - name: Guard runtime artifacts
        run: npm run validate:artifacts

      - name: Audit locked dependencies
        run: npm run validate:dependencies

      - name: Confirm clean checkout
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  windows-release-gate:
    name: Windows Node 22 - mandatory release gates
    runs-on: windows-2022
    # The full unfiltered canonical suite now runs with bounded file
    # concurrency inside the release gate; allow the preceding security gates
    # and that suite to complete without dropping mandatory coverage.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic locale and timezone
        shell: pwsh
        run: "'TZ=UTC' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append; 'LC_ALL=C' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Require working Microsoft Edge (headless DOM probe)
        run: node scripts/validate-edge-e2e.js --probe

      - name: Require six real Windows Edge E2E cases (no skips)
        run: node scripts/validate-edge-e2e.js --run

      - name: Run repository release gate
        run: npm run validate:release-gate

      - name: Confirm clean checkout
        shell: pwsh
        run: if (git status --porcelain) { throw 'checkout contains generated artifacts' }

  windows-canonical-shards:
    name: Windows Node 22 - canonical shard ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic locale and timezone
        shell: pwsh
        run: "'TZ=UTC' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append; 'LC_ALL=C' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Run canonical test shard
        # Both shards together cover the unfiltered canonical npm test.
        # The mandatory release job independently retains the full suite.
        run: node scripts/run-windows-canonical-tests.js --shard=${{ matrix.shard }}

      - name: Confirm clean checkout
        shell: pwsh
        run: if (git status --porcelain) { throw 'checkout contains generated artifacts' }

  windows-canonical-suite:
    name: Windows Node 22 - complete canonical tests
    runs-on: ubuntu-latest
    needs: [windows-canonical-shards]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require every canonical shard to pass
        env:
          SHARDS_RESULT: ${{ needs.windows-canonical-shards.result }}
        run: node scripts/check-windows-ci-results.js --canonical-shards

  windows-validation:
    name: Windows Node 22 - syntax and tests
    runs-on: ubuntu-latest
    needs: [windows-release-gate, windows-canonical-suite]
    if: ${{ always() }}
    steps:
      - name: Check out aggregator validator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js for aggregator
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require both Windows jobs to pass
        env:
          RELEASE_RESULT: ${{ needs.windows-release-gate.result }}
          SUITE_RESULT: ${{ needs.windows-canonical-suite.result }}
        run: node scripts/check-windows-ci-results.js
