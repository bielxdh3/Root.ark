name: Security Regression

on:
  pull_request:
    branches:
      - Root/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-validation:
    name: Ubuntu Node 22 - full validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic locale and timezone
        run: echo "TZ=UTC" >> $GITHUB_ENV && echo "LC_ALL=C" >> $GITHUB_ENV

      - name: Run syntax validation
        run: npm run validate:syntax

      - name: Run automated tests
        run: npm test

      - name: Guard runtime artifacts
        run: npm run validate:artifacts

      - name: Audit locked dependencies
        run: npm run validate:dependencies

      - name: Confirm clean checkout
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  windows-validation:
    name: Windows Node 22 - syntax and tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic locale and timezone
        shell: pwsh
        run: "'TZ=UTC' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append; 'LC_ALL=C' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Run syntax validation
        run: npm run validate:syntax

      - name: Run automated tests
        run: npm test

      - name: Guard runtime artifacts
        run: npm run validate:artifacts

      - name: Confirm clean checkout
        shell: pwsh
        run: if (git status --porcelain) { throw 'checkout contains generated artifacts' }
